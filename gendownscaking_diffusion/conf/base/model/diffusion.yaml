name: diffusion
# Model type.
hr_mean_conditioning: True
# Recommended to use high-res conditioning for diffusion.

# Standard model parameters.
model_args:
  gridtype: "sinusoidal"
  # Type of positional grid to use: 'sinusoidal', 'learnable', 'linear'.
  # Controls how positional information is encoded.
  N_grid_channels: 4
  # Number of channels for positional grid embeddings
  embedding_type: "positional"
  # Type of timestep embedding: 'positional' for DDPM++, 'fourier' for NCSN++,
  # 'zero' for none

# DiffusionLoss hyper-parameters (used when regression_net is None).
# Override these per-dataset via the top-level config file.
sigma_data: 0.217
# Expected std of the training target data; influences the EDM preconditioning weight.
# Measured via scripts/compute_sigma_data.py on single-channel hPM25-log.
P_mean: -1.2
# Log-mean of the noise-level distribution for direct full-field prediction.
P_std: 1.2
# Log-std of the noise-level distribution.
